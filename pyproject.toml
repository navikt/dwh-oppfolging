[project]
name = "dwh-oppfolging"
version = "0.2.2"
description = "Oppfolging python package for DWH ETL"
authors = [{ name = "Team Oppfølging" }]
requires-python = "==3.12.*"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests==2.34.2",
    "pendulum==3.2.0",
    "ijson==3.5.0",
    "dbt-oracle==1.12.0",
    "oracledb==26.0.1",
    "google-cloud-secret-manager==2.26.0",
    "confluent-kafka[avro, json, schemaregistry]==2.16.0",
    "fastavro==1.12.2",
    "google-cloud-bigquery==3.43.0",
    "pydantic==2.13.4",
    "plotly==6.6.0",
    "numpy==2.4.6",
    "paramiko==5.1.0",
    "certifi>=2026.10.23",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pylint",
    "pytest",
    "testcontainers[oracledb, kafka]",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["dwh_oppfolging"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

# [tool.sqlfluff.core]
# dialect = "oracle"

# [tool.sqlfluff.indentation]
# indented_joins = "True"
# indented_ctes = "True"

# [tool.sqlfluff.rules]
# comma_style = "leading"
# tab_space_size = 4
# capitalisation_policy = "lower"
# operator_new_lines = "after"
# aliasing = "explicit"

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=examples --ignore=tests/wip"
markers = ["local"]

[tool.mypy]
files = "dwh_oppfolging"

[[tool.mypy.overrides]]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
]
max-line-length = 120

