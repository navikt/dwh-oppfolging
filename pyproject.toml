[tool.poetry]
name = "dwh-oppfolging"
version = "0.2.1"
description = "Oppfolging python package for DWH ETL"
authors = ["Team Oppfølging"]
packages = [{include = "dwh_oppfolging"}]
readme = "README.md"


[tool.poetry.dependencies]
python = "3.12.*"       # python 3.12 mangler distutils, som ødelegger installasjon av pendulum 2.1.2
                        # derfor låser vi oss til python 3.11
requests = "2.34.2"
pendulum = "3.2.0"      # fjernet airflow/dataverk i dev fordi den bruker en eldgammel versjon av pendulum
ijson = "3.5.0"
dbt-oracle = "1.11.1"
oracledb = "4.0.2"     # note: dbt-oracle no longer has any specific version requirements here, so we can use the latest

google-cloud-secret-manager = "2.26.0"
confluent-kafka = { version = "2.15.0", extras = ["avro", "json", "schemaregistry"]} 
fastavro = "1.12.2"
google-cloud-bigquery = "3.43.0"
pydantic = "2.12.5"

plotly = "6.6.0"
numpy = "2.4.6" # trengs av noen deler av plotly 
paramiko = "4.0.0"

[tool.poetry.group.dev.dependencies]
black = "*"
mypy = "*"
pylint = "*"
pytest = "*"
testcontainers = {version = "*", extras = ["oracledb", "kafka"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# [tool.sqlfluff.core]
# dialect = "oracle"

# [tool.sqlfluff.indentation]
# indented_joins = "True"
# indented_ctes = "True"

# [tool.sqlfluff.rules]
# comma_style = "leading"
# tab_space_size = 4
# capitalisation_policy = "lower"
# operator_new_lines = "after"
# aliasing = "explicit"

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=examples --ignore=tests/wip"
markers = ["local"]

[tool.mypy]
files = "dwh_oppfolging"

[[tool.mypy.overrides]]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
]
max-line-length = 120

