name: On push, doc-test package
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - dwh_oppfolging/**
      - pyproject.toml
  pull_request:
    branches:
      - main
    paths:
      - dwh_oppfolging/**
      - pyproject.toml

jobs:
  install_lint_and_test:
    runs-on: 
      ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.0.3 Replaces pip install uv
        with:
          enable-cache: false
          python-version: 3.12
          version: ">=0.13.4"
      - run: uv sync --frozen
      - run: uv run pytest dwh_oppfolging
